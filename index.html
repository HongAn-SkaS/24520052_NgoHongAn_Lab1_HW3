
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Countdown</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <h1>Coming Soon</h1>
        <p>Something exciting is on the way.</p>
    </header>

    <main>
        <section
            id="countdown"
            aria-live="polite"
            data-target="2026-12-31T23:59:59Z"
        >
            <h2>Launch Countdown</h2>
            <p id="countdown-display">Loading...</p>
        </section>

<section id="register">
    <header>
        <h2>Stay Updated</h2>
        <p>Register to receive launch updates.</p>
    </header>

    <form id="register-form" novalidate>
        <fieldset>
            <legend>Registration Form</legend>

            <p>
                <label for="name">Full Name</label>
                <input
                    id="name"
                    name="name"
                    type="text"
                    required
                    minlength="3"
                >
            </p>

            <p>
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                >
            </p>

            <p>
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    required
                    minlength="10"
                ></textarea>
            </p>

            <button type="submit">Register</button>

            <p id="form-status" role="status" aria-live="polite"></p>
        </fieldset>
    </form>
</section>

    </main>

    <footer>
        <p>&copy; 2026 Launch Countdown. All rights reserved.</p>
    </footer>
</body>
</html>
